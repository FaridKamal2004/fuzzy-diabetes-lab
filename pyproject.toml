[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-diabetes-lab"
version = "2.0.0"
description = "An explainable, educational Mamdani fuzzy inference lab"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["scikit-fuzzy==0.5.0", "numpy==2.2.6", "scipy==1.15.3", "networkx==3.4.2", "matplotlib==3.10.3"]

[project.scripts]
fuzzy-lab = "fuzzy_diabetes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fuzzy_diabetes = ["model.json"]
